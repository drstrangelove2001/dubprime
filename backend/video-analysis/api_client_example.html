<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Removal API - Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #f0f4ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .method-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .method-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .method-btn:hover {
            background: #f8f9ff;
        }
        
        .method-btn.active {
            background: #667eea;
            color: white;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .status.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .progress {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .file-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        
        .file-info div {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        
        .download-btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Audio Removal Tool</h1>
        <p class="subtitle">Remove audio from videos instantly</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p><strong>Click to upload</strong> or drag and drop</p>
            <p style="color: #999; font-size: 12px; margin-top: 5px;">
                Supported: MP4, AVI, MOV, MKV, FLV, WMV, WebM
            </p>
            <input type="file" id="fileInput" accept="video/*">
        </div>
        
        <div class="method-selector">
            <button class="method-btn active" data-method="ffmpeg">
                ⚡ FFmpeg (Fast)
            </button>
            <button class="method-btn" data-method="moviepy">
                🐍 MoviePy (Python)
            </button>
        </div>
        
        <button class="btn" id="processBtn" disabled>
            Process Video
        </button>
        
        <div class="progress" id="progress">
            <div class="progress-bar"></div>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="file-info" id="fileInfo"></div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5000/api';
        let selectedFile = null;
        let selectedMethod = 'ffmpeg';
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const progress = document.getElementById('progress');
        const status = document.getElementById('status');
        const fileInfo = document.getElementById('fileInfo');
        
        // Method selection
        document.querySelectorAll('.method-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMethod = btn.dataset.method;
            });
        });
        
        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // File selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        
        function handleFile(file) {
            if (!file) return;
            
            selectedFile = file;
            uploadArea.innerHTML = `
                <div class="upload-icon">✅</div>
                <p><strong>${file.name}</strong></p>
                <p style="color: #999; font-size: 12px; margin-top: 5px;">
                    ${(file.size / (1024*1024)).toFixed(2)} MB
                </p>
            `;
            processBtn.disabled = false;
            fileInfo.style.display = 'none';
            status.style.display = 'none';
        }
        
        // Process video
        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            processBtn.disabled = true;
            progress.style.display = 'block';
            status.style.display = 'none';
            fileInfo.style.display = 'none';
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('method', selectedMethod);
            
            try {
                const response = await fetch(`${API_URL}/remove-audio`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                progress.style.display = 'none';
                
                if (response.ok) {
                    showStatus('success', '✅ Audio removed successfully!');
                    showFileInfo(data);
                } else {
                    showStatus('error', `❌ Error: ${data.error}`);
                    processBtn.disabled = false;
                }
                
            } catch (error) {
                progress.style.display = 'none';
                showStatus('error', `❌ Network error: ${error.message}`);
                processBtn.disabled = false;
            }
        });
        
        function showStatus(type, message) {
            status.className = `status ${type}`;
            status.textContent = message;
            status.style.display = 'block';
        }
        
        function showFileInfo(data) {
            let html = `
                <div>
                    <strong>Original Size:</strong>
                    <span>${data.size_info.original_mb} MB</span>
                </div>
                <div>
                    <strong>New Video Size:</strong>
                    <span>${data.size_info.new_mb} MB</span>
                </div>
                <div>
                    <strong>Size Reduction:</strong>
                    <span style="color: #28a745;">${data.size_info.reduction_mb} MB</span>
                </div>
            `;
            
            // Add audio info if available
            if (data.audio_filename) {
                html += `
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e0e0e0;">
                        <strong>Audio File (${data.audio_format.toUpperCase()}):</strong>
                        <span>${data.audio_size_mb} MB</span>
                    </div>
                `;
            }
            
            html += `
                <button class="download-btn" onclick="downloadFile('${data.video_filename}')">
                    🎬 Download Video
                </button>
            `;
            
            // Add audio download button if available
            if (data.audio_filename) {
                html += `
                    <button class="download-btn" style="background: #007bff; margin-top: 10px;" onclick="downloadFile('${data.audio_filename}')">
                        🔊 Download Audio
                    </button>
                `;
            }
            
            fileInfo.innerHTML = html;
            fileInfo.style.display = 'block';
        }
        
        function downloadFile(filename) {
            window.open(`${API_URL}/download/${filename}`, '_blank');
        }
    </script>
</body>
</html>
